<VirtualHost *:443>

  ServerName mesonet1.agron.iastate.edu
  ServerAlias mesonet2.agron.iastate.edu
  ServerAlias mesonet3.agron.iastate.edu
  ServerAlias www.mesonet.agron.iastate.edu

  SSLEngine on
  # This looks like LE, but is actually ISU CA issued
  SSLCertificateFile /etc/letsencrypt/live/mesonet-dc-vip.agron.iastate.edu/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/mesonet-dc-vip.agron.iastate.edu/privkey.pem

  # Don't care to log these requests
  CustomLog /dev/null combined

  # Redirect everything to mesonet
  Redirect permanent / https://mesonet.agron.iastate.edu/

</VirtualHost>

<VirtualHost *:443>
  # Use a hourly deadicated log file
  CustomLog "|/usr/sbin/rotatelogs ${IEMWEBFARM_LOGROOT}/iemssl-%Y%m%d%H 3600" combined

  SSLEngine on
  # using ISU Certs due to cross-signing ugliness with LE and ancient kiosks
  # https://mesonet.agron.iastate.edu/onsite/news.phtml?id=1423
  # SSLCertificateChainFile was removed in Apache 2.4.8
  SSLCertificateFile /etc/letsencrypt/live/mesonet-dc-vip.agron.iastate.edu/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/mesonet-dc-vip.agron.iastate.edu/privkey.pem

  Include conf.d/mesonet.inc

</VirtualHost>
