<VirtualHost *:80>

  ServerName mesonet1.agron.iastate.edu
  ServerAlias mesonet2.agron.iastate.edu
  ServerAlias mesonet3.agron.iastate.edu
  ServerAlias www.mesonet.agron.iastate.edu

  # Redirect everything to mesonet
  Redirect permanent / http://mesonet.agron.iastate.edu/

</VirtualHost>

<VirtualHost *:80>
  # Use a hourly deadicated log file
  CustomLog "|/usr/sbin/rotatelogs ${IEMWEBFARM_LOGROOT}/iem-%Y%m%d%H 3600" combined

  Include conf.d/mesonet.inc

</VirtualHost>
